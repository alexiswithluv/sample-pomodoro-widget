<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css" />

  </head>
  <body>
    <div class="scale-widget">
      <div class="widget-container">
      <img src="assets/bg.png" class="bg">
      <p id="countdown">00:00</p>
      <p id="text">you got this!</p>
      <audio id="alarm-sound" src="assets/Gentle-wake-alarm-clock.mp3" preload="auto"></audio>
      
      <img src="assets/half apple.png" class="apple" id="half apple">
      <img src="assets/eaten apple.png" class="apple" id="eaten apple">

      <div class="btns">
        <img src="assets/btn-10mins.png" class="duration-btn" id="btn-10mins" data-minutes="10"></button>
        <img src="assets/btn-15mins.png" class="duration-btn" id="btn-15mins" data-minutes="15"></button>
        <img src="assets/btn-25mins.png" class="duration-btn" id="btn-25mins" data-minutes="25"></button>

        <img src="assets/icon-pause.png" id="icon-pause"></button>
        <img src="assets/icon-restart.png" id="icon-restart"></button>

      </div>

      <script src="script.js"></script>
    </div>
    </div>
    


  </body>
</html>
