<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css" />

  </head>
  <body>

    <div class="widget-container">
      <img src="assets/bg.png" class="bg">
      <p id="countdown">00:00</p>
      <p id="text">you got this!</p>
      
      <img src="assets/half apple.png" class="apple">

      <div class="btns">
        <img src="assets/btn-10mins.png" class="duration-btn" id="btn-10mins" data-minutes="10"></button>
        <img src="assets/btn-15mins.png" class="duration-btn" id="btn-15mins" data-minutes="15"></button>
        <img src="assets/btn-25mins.png" class="duration-btn" id="btn-25mins" data-minutes="25"></button>

        <img src="assets/icon-pause.png" id="icon-pause"></button>
        <img src="assets/icon-restart.png" id="icon-restart"></button>
  <!-- 
        <button class="duration-btn" data-minutes="10">10 Min</button>
        <button class="duration-btn" data-minutes="15">15 Min</button>
        <button class="duration-btn" data-minutes="25">25 Min</button>
        <button id="pause-btn">Pause</button>
        <button id="reset_Btn">Reset</button> -->
      </div>

  
      <script src="script.js"></script>
    </div>


  </body>
</html>
